title: Cache repeated reads
status: draft
priority: 10
when:
  readWrite: [read-heavy]
  traffic: [100-1k, 1k-10k, over-10k]
architecture:
  add: [cache]
sections:
  why:
    - text: "Most requests read the same data. A cache in front of the database (cache-aside) removes repeated work."
      chapters: [caching, cache-aside]
  alternatives:
    - text: "First add missing indexes and fix slow queries; that is often cheaper than a cache."
      chapters: [database-indexes, query-optimization]
    - text: "HTTP caching or a CDN, for responses that are the same for every user."
      chapters: [http-caching, cdn]
  bottlenecks:
    - text: "Invalidation: stale data after writes, and a burst of database load when a popular key expires."
      chapters: [cache-invalidation, cache-stampede]
  lockIn:
    - "Low if the cache is used through a small interface: its data can always be rebuilt from the database."
  measure:
    - "Cache hit ratio, and database load before and after the cache."
