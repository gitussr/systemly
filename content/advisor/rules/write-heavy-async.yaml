title: Absorb write bursts with a queue and background workers
status: draft
priority: 10
when:
  readWrite: [write-heavy]
architecture:
  add: [queue]
sections:
  why:
    - text: "Accept writes quickly and process them in background workers. Bursts wait in the queue instead of overloading the database."
      chapters: [why-queues-exist, message-queue, worker, backpressure]
  bottlenecks:
    - text: "Messages can be delivered more than once, so workers must be idempotent."
      chapters: [idempotency, message-delivery-semantics]
    - text: "Messages that always fail need a dead-letter queue, or they block or retry forever."
      chapters: [dead-letter-queues]
  lockIn:
    - "Managed queues differ in delivery guarantees, ordering and limits. Publish and consume through one small interface."
